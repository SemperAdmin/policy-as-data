name: validate

# CI for SemperAdmin/policy-as-data - every push and PR must pass the
# repo's own validator (XSD + schema checks over data/). Machine-encoded
# policy that fails validation never lands on main.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # v5/v6 run on Node 24; the v4/v5 majors targeted Node 20, which GitHub
      # deprecated on its runners in late 2025 and CI warned about on every run.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        # xmllint does the XSD work (subprocess), rdflib activates the
        # ontology + conformance checks instead of skipping them.
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          pip install rdflib
      - name: Validate corpus
        run: python tools/validate.py
      - name: Run the claims table
        # tests/claims.json: what the tooling claims about itself, positive
        # and negative, with the negatives as the gate. Writes nothing.
        run: python tests/run_claims.py
      - name: Canonical-free stages reproduce committed output
        # Stages 16, 16a and 17-22 of build.sh read no canonical/, so CI
        # re-runs them in build.sh order and requires a clean tree. The diff
        # is over the whole tree, not a file list, so a new canonical-free
        # output is covered without editing this step.
        run: |
          python tools/reconcile.py --out config/reconciliation.json
          python tools/check_logic.py
          python tools/render_verification.py
          python tools/render_currency.py
          python tools/render_impact.py
          python tools/render_scale.py
          python tools/render_scenarios.py
          python tools/render_pages.py
          # git diff catches a changed output; status catches a new one
          # that was never committed.
          if ! git diff --exit-code --stat || [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Committed output does not match its sources. Run ./build.sh and commit its output."
            exit 1
          fi
      - name: Build output matches its inputs
        # Stages 1-14 need canonical/, which CI does not have. The stamp
        # written by build.sh stage 24 records a digest of every tracked
        # input; a mismatch means an input changed after the last build.
        run: python tools/build_stamp.py --check

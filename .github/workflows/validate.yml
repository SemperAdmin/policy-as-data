name: validate

# CI for SemperAdmin/policy-as-data - every push and PR must pass the
# repo's own validator (XSD + schema checks over data/). Machine-encoded
# policy that fails validation never lands on main.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # v5/v6 run on Node 24; the v4/v5 majors targeted Node 20, which GitHub
      # deprecated on its runners in late 2025 and CI warned about on every run.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        # xmllint does the XSD work (subprocess), rdflib activates the
        # ontology + conformance checks instead of skipping them.
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          pip install rdflib
      - name: Validate corpus
        run: python tools/validate.py
